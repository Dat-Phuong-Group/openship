# ──────────────────────────────────────────────────────────
# Openship — Docker Compose (Dokploy-first)
#
# Primary target: Dokploy Compose + Traefik domains (no host port binds).
#   Set secrets in Dokploy → Environment (INTERNAL_TOKEN, BETTER_AUTH_*).
#   Map domains: web:3000, dashboard:3001, api:4000
#
# Optional local with localhost ports:
#   cp .env.example .env   # then edit secrets
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# ONE set of services. The MODE is decided entirely by env — there are no
# profiles and no per-mode service variants:
#   • Default (users): self-hosted  → CLOUD_MODE=false
#   • SaaS (our env):                 CLOUD_MODE=true + OPENSHIP_TARGET=cloud-saas
#                                     + Oblien / GitHub App / secrets
#
# Services (container ports; Docker-network only — Dokploy Traefik publishes):
#   • postgres → private :5432   (storage)
#   • redis    → private :6379   (queue + cache + rate-limit)
#   • api      → :4000
#   • dashboard→ :3001
#   • web      → :3000
#
# The API auto-migrates Postgres on boot.
# ──────────────────────────────────────────────────────────

services:
  # ─── Database (storage, private) ──────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openship}
      POSTGRES_DB: ${POSTGRES_DB:-openship}
    # PRIVATE: not published to the host. api reaches it at postgres:5432.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openship} -d ${POSTGRES_DB:-openship}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── Cache / Queue / Rate-limit (private) ─────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # PRIVATE: not published to the host. api reaches it at redis:6379.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── API (control plane) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    expose:
      - "4000"
    # Mode + secrets (CLOUD_MODE, DEPLOY_MODE, OPENSHIP_TARGET, Oblien, GitHub
    # App, auth secrets, …) come from .env and/or the host's env (Dokploy UI).
    # `.env` is optional so Dokploy can inject vars without a committed file.
    # The values below OVERRIDE with fixed internal port + in-cluster DNS.
    # REQUIRED for boot: INTERNAL_TOKEN (32+ random bytes). Without it the API
    # refuses to start and stays unhealthy — set it in Dokploy → Environment.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Keep these compose-owned so a Dokploy UI DATABASE_URL=localhost does not
      # point the API at the container loopback (instant boot crash → unhealthy).
      DATABASE_URL: postgresql://${POSTGRES_USER:-openship}:${POSTGRES_PASSWORD:-openship}@postgres:5432/${POSTGRES_DB:-openship}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD (not CMD-SHELL) + script — avoids quote-mangling on Dokploy.
      # start_period covers first-boot migrations + job-runner init before listen.
      test: ["CMD", "bun", "apps/api/scripts/docker-healthcheck.ts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  # ─── Dashboard (app UI) ───────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  # ─── Web / Landing ────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

volumes:
  postgres_data:
  redis_data:
